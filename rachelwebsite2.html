document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

">{{ p.body }}<\u002Fp>\n                <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.08em;color:var(--blue-700);\">{{ p.cta }} →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fx-import>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"perfect\" data-screen-label=\"Home – PERFECT plan\" style=\"background:#fff;\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:{{ secPad }};display:flex;flex-direction:column;gap:48px;\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;max-width:64ch;\">\n          <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.14em;color:var(--blue-600);\">SEVEN DAILY HABITS<\u002Fspan>\n          <h2 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-0.015em;color:var(--blue-800);\">The PERFECT Health Plan<\u002Fh2>\n          <p style=\"margin:0;font-size:18px;line-height:1.6;\">Each letter is one simple habit. Start with one, then add the next.<\u002Fp>\n        <\u002Fdiv>\n        <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0;border-top:1px solid var(--border-hairline);\">\n          <sc-for list=\"{{ perfect }}\" as=\"h\" hint-placeholder-count=\"7\">\n            <li style=\"display:grid;grid-template-columns:72px 1fr;gap:16px;padding:24px 16px 24px 0;border-bottom:1px solid var(--border-hairline);align-items:start;\">\n              <span aria-hidden=\"true\" style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:56px;line-height:0.9;letter-spacing:-0.02em;color:var(--blue-800);\">{{ h.letter }}<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <h3 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:18px;color:var(--blue-800);\">{{ h.title }}<\u002Fh3>\n                <p style=\"margin:0;line-height:1.6;font-size:16px;\">{{ h.body }}<\u002Fp>\n                <a href=\"{{ h.href }}\" target=\"{{ h.target }}\" sc-camel-on-click=\"{{ h.go }}\" style=\"font-size:15px;font-weight:600;\">{{ h.link }}<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:var(--surface-canvas);\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:{{ secPad }};display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:48px;align-items:center;\">\n        <div style=\"position:relative;border-radius:16px;overflow:hidden;background:#22344f;aspect-ratio:16/9;\">\n          <video ref=\"{{ videoRef }}\" src=\"https://drrachel.com.au/wp-content/uploads/2024/08/export.mp4#t=1\" controls=\"{{ videoStarted }}\" preload=\"metadata\" playsinline=\"{{ true }}\" aria-label=\"Welcome video from Dr Rachel's Health Hub\" style=\"width:100%;height:100%;display:block;object-fit:cover;\"><\u002Fvideo>\n          <sc-if value=\"{{ videoIdle }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ playVideo }}\" aria-label=\"Play the welcome video (8 minutes)\" style=\"position:absolute;inset:0;border:0;padding:0;cursor:pointer;background:rgba(34,52,79,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;\" style-hover=\"background:rgba(34,52,79,.2);\">\n              <span style=\"width:84px;height:84px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.3);\">\n                <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"margin-left:5px;\"><path d=\"M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z\" fill=\"var(--blue-800)\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:14px;letter-spacing:0.12em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);\">WATCH · 8 MIN<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.14em;color:var(--blue-600);\">VIDEO LIBRARY<\u002Fspan>\n          <h2 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-0.015em;color:var(--blue-800);\">Watch and learn at home<\u002Fh2>\n          <p style=\"margin:0;font-size:18px;line-height:1.6;max-width:52ch;\">Short talks on lifestyle medicine, natural remedies and higher wisdom. New videos go up on our YouTube channel.<\u002Fp>\n          <div style=\"display:flex;\">\n            <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Button\" variant=\"outline\" href=\"https://www.youtube.com/@drrachelshealthhub\" hint-size=\"220px,44px\">Visit our channel<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Home – team\" style=\"background:#fff;\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:{{ secPad }};display:flex;flex-direction:column;gap:48px;\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.14em;color:var(--blue-600);\">OUR TEAM<\u002Fspan>\n          <h2 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-0.015em;color:var(--blue-800);\">Who we are<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:32px;\">\n          <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Card\" padding=\"lg\" accent-top=\"{{ true }}\" hint-size=\"100%,420px\">\n            <div style=\"display:grid;grid-template-columns:{{ teamCols }};gap:24px;align-items:start;\">\n              <img src=\"https://drrachel.com.au/wp-content/uploads/2024/06/Rachel-Homepage500-x-700-px.png\" alt=\"Portrait of Dr Rachel Coelho\" style=\"width:{{ teamImgW }};aspect-ratio:{{ teamImgAR }};object-fit:cover;object-position:center 20%;border-radius:10px;background:var(--blue-050);\">\n              <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                  <h3 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:24px;color:var(--blue-800);\">Dr Rachel Coelho<\u002Fh3>\n                  <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.08em;color:var(--blue-700);\">GP · HERBALISM · LIFESTYLE MEDICINE<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:0;line-height:1.6;\">I'm a GP working solo in a busy rural practice. I practise conventional medicine, but my passion, and much of my postgraduate study, is natural medicine: medicinal herbalism, lifestyle medicine, nutrition and hydrotherapy.<\u002Fp>\n                <p style=\"margin:0;line-height:1.6;\">I'm the wife of an extraordinary evangelist and mother of two amazing adult children. Most importantly, I'm a dedicated Christian who believes spirituality and health go hand in hand.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fx-import>\n          <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Card\" padding=\"lg\" accent-top=\"{{ true }}\" hint-size=\"100%,420px\">\n            <div style=\"display:grid;grid-template-columns:{{ teamCols }};gap:24px;align-items:start;\">\n              <img src=\"https://drrachel.com.au/wp-content/uploads/2024/06/Rui-homepage-image-500-x-700-px.png\" alt=\"Portrait of Rui Coelho\" style=\"width:{{ teamImgW }};aspect-ratio:{{ teamImgAR }};object-fit:cover;object-position:center 20%;border-radius:10px;background:var(--blue-050);\">\n              <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                  <h3 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:24px;color:var(--blue-800);\">Rui Coelho, MBA<\u002Fh3>\n                  <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.08em;color:var(--blue-700);\">LECTURER · COACH · SPEAKER<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:0;line-height:1.6;\">I'm a university lecturer, manager, business consultant and executive coach. I specialise in life improvement and personal development, and hold an MBA and other postgraduate qualifications in leadership.<\u002Fp>\n                <p style=\"margin:0;line-height:1.6;\">I've travelled the world as a speaker and evangelist, sharing Bible certainty and prophetic interpretation. Here I share life wisdom to encourage deeper thinking and personal growth.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ HEALTH EDITORIALS ============ -->\n  <sc-if value=\"{{ isHealth }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Health editorials\" style=\"background:var(--surface-canvas);\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:{{ pagePad }};display:flex;flex-direction:column;gap:40px;\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;max-width:64ch;\">\n          <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.14em;color:var(--blue-600);\">HEALTH EDITORIALS · BY DR RACHEL<\u002Fspan>\n          <h1 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(36px,5vw,56px);line-height:1.05;letter-spacing:-0.02em;color:var(--blue-800);\">Practical guides to common conditions<\u002Fh1>\n          <p style=\"margin:0;font-size:18px;line-height:1.6;\">Each guide explains the condition, then shows how the PERFECT habits and natural remedies can help. Every guide has a printable PDF.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:24px;\">\n          <sc-for list=\"{{ healthPosts }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Card\" padding=\"none\" interactive=\"{{ true }}\" on-click=\"{{ a.go }}\" hint-size=\"100%,380px\" style=\"overflow:hidden;\">\n              <div style=\"display:flex;flex-direction:column;height:100%;\">\n                <img src=\"{{ a.img }}\" alt=\"\" style=\"width:100%;aspect-ratio:8/5;object-fit:cover;display:block;background:var(--blue-050);\">\n                <div style=\"padding:24px;display:flex;flex-direction:column;gap:10px;\">\n                  <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:12px;letter-spacing:0.12em;color:var(--blue-700);\">{{ a.tag }}<\u002Fspan>\n                  <h2 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:22px;color:var(--blue-800);\">{{ a.title }}<\u002Fh2>\n                  <p style=\"margin:0;line-height:1.6;font-size:16px;\">{{ a.excerpt }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fx-import>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ ARTICLE ============ -->\n  <sc-if value=\"{{ isArticle }}\" hint-placeholder-val=\"{{ false }}\">\n    <article data-screen-label=\"Article – Defeating Diabetes\" style=\"background:#fff;\">\n      <div style=\"max-width:760px;margin:0 auto;padding:{{ pagePad }};display:flex;flex-direction:column;gap:32px;\">\n        <nav aria-label=\"Breadcrumb\" style=\"display:flex;gap:8px;font-size:15px;flex-wrap:wrap;\">\n          <a href=\"#\" sc-camel-on-click=\"{{ goHealthLink }}\">Health editorials<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><span>Defeating diabetes<\u002Fspan>\n        <\u002Fnav>\n        <header style=\"display:flex;flex-direction:column;gap:16px;\">\n          <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.14em;color:var(--blue-600);\">HEALTH EDITORIAL · TYPE 2 DIABETES<\u002Fspan>\n          <h1 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(36px,5vw,56px);line-height:1.05;letter-spacing:-0.02em;color:var(--blue-800);\">Defeating diabetes<\u002Fh1>\n          <p style=\"margin:0;font-size:20px;line-height:1.6;color:var(--ink-700);\">How diet, movement, sleep and sunlight can prevent, manage and even reverse type 2 diabetes.<\u002Fp>\n          <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--text-muted);\">\n            <span>{{ postByline }}<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspan><span>27 September 2024<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspan><span>10 minute read<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <img src=\"https://drrachel.com.au/wp-content/uploads/2024/09/Diabetes.png\" alt=\"Illustration for the Defeating Diabetes editorial\" style=\"width:100%;border-radius:16px;display:block;background:var(--blue-050);\">\n\n        <sc-if value=\"{{ postIsHealth }}\" hint-placeholder-val=\"{{ true }}\">\n        <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Card\" tint=\"blue\" padding=\"md\" hint-size=\"100%,96px\">\n          <p style=\"margin:0;line-height:1.6;\"><strong style=\"color:var(--blue-800);\">Before you change anything:<\u002Fstrong> this guide is general information, not personal medical advice. Talk to your own doctor before changing or stopping any diabetes medication. Blood sugar can drop quickly when diet changes.<\u002Fp>\n        <\u002Fx-import>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;flex-direction:column;gap:20px;font-size:18px;line-height:1.7;\">\n          <p style=\"margin:0;\">Diabetes is a chronic disorder of high blood sugar. It happens when the pancreas doesn't make enough insulin, or the body can't use insulin properly. Insulin is the hormone that moves glucose from the blood into cells, where it's used for energy. There are two distinct types.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;\">\n            <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Card\" tint=\"white\" padding=\"md\" hint-size=\"100%,260px\">\n              <h3 style=\"margin:0 0 8px;font-family:Montserrat,sans-serif;font-weight:800;font-size:18px;color:var(--blue-800);\">Type 1 diabetes<\u002Fh3>\n              <ul style=\"margin:0;padding-left:20px;line-height:1.6;font-size:16px;display:flex;flex-direction:column;gap:4px;\">\n                <li>The immune system destroys insulin-making cells<\u002Fli>\n                <li>Comes on quickly, over weeks or months<\u002Fli>\n                <li>Usually starts in childhood, but can occur at any age<\u002Fli>\n                <li>Little or no insulin is made<\u002Fli>\n                <li>Lifelong insulin is needed<\u002Fli>\n              <\u002Ful>\n            <\u002Fx-import>\n            <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Card\" tint=\"white\" accent-top=\"{{ true }}\" padding=\"md\" hint-size=\"100%,260px\">\n              <h3 style=\"margin:0 0 8px;font-family:Montserrat,sans-serif;font-weight:800;font-size:18px;color:var(--blue-800);\">Type 2 diabetes — the focus of this guide<\u002Fh3>\n              <ul style=\"margin:0;padding-left:20px;line-height:1.6;font-size:16px;display:flex;flex-direction:column;gap:4px;\">\n                <li>Strongly linked to diet, weight and inactivity<\u002Fli>\n                <li>Comes on slowly, over years<\u002Fli>\n                <li>Usually after 45, but increasingly in younger people<\u002Fli>\n                <li>Insulin is made, but cells resist it<\u002Fli>\n                <li>Lifestyle change is very successful, especially early<\u002Fli>\n              <\u002Ful>\n            <\u002Fx-import>\n          <\u002Fdiv>\n\n          <h2 style=\"margin:24px 0 0;font-family:Montserrat,sans-serif;font-weight:800;font-size:28px;color:var(--blue-800);\">Risk factors and symptoms<\u002Fh2>\n          <p style=\"margin:0;\">Risk factors include an unhealthy diet, inactivity, being overweight, genetics and ethnicity, age, gestational diabetes, polycystic ovary syndrome, high blood pressure and sleep disorders.<\u002Fp>\n          <p style=\"margin:0;\">Type 2 diabetes often develops without symptoms at first. As it progresses, you may notice:<\u002Fp>\n          <ul style=\"margin:0;padding-left:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 24px;\">\n            <li>Thirst — drinking more<\u002Fli><li>Passing more urine<\u002Fli><li>Hunger — eating more<\u002Fli><li>Tiredness and weakness<\u002Fli><li>Blurred vision<\u002Fli><li>Tingling or numb hands and feet<\u002Fli><li>Slow-healing wounds<\u002Fli><li>Recurring infections<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;\">Untreated, it can damage the heart, nerves, kidneys, eyes, feet, gut and skin, and lead to premature death.<\u002Fp>\n\n          <h2 style=\"margin:24px 0 0;font-family:Montserrat,sans-serif;font-weight:800;font-size:28px;color:var(--blue-800);\">How sugar is used in the body<\u002Fh2>\n          <p style=\"margin:0;\">Food is broken down into its parts to be absorbed. Carbohydrate becomes glucose, the main fuel for every cell. As glucose rises in the blood, beta cells in the pancreas release insulin. Insulin works like a key, unlocking receptors on cells so glucose can enter.<\u002Fp>\n          <p style=\"margin:0;\">In type 2 diabetes, cells become resistant to insulin. The key no longer turns fully, so sugar builds up in the blood. At first the pancreas makes extra insulin to compensate. Over time the beta cells tire, and without early action, insulin may eventually be needed.<\u002Fp>\n\n          <h2 style=\"margin:24px 0 0;font-family:Montserrat,sans-serif;font-weight:800;font-size:28px;color:var(--blue-800);\">P — Plant-based diet and pure water<\u002Fh2>\n          <p style=\"margin:0;\">Diet is front and centre in preventing, managing and even reversing type 2 diabetes. Carbohydrate itself isn't the villain. Diabetes has been rare in many Asian and African countries eating high-fibre, carbohydrate-rich diets of starchy vegetables, beans, rice and grains.<\u002Fp>\n          <p style=\"margin:0;\">The bigger problem is saturated animal fat, found in meat, dairy and eggs. It drives inflammation and oxidative stress, which stop insulin working well. Plant fats from nuts, olives and avocados actually improve insulin sensitivity.<\u002Fp>\n          <p style=\"margin:0;\">The gold standard is a whole-food plant-based diet: fruit, vegetables, whole grains, legumes, nuts and seeds, with few or no animal products or processed foods. In studies, vegetarians who still ate eggs and dairy cut their diabetes risk by about 60%. Fully plant-based eaters cut it by about 80%.<sup><a href=\"#ref1\">1<\u002Fa><\u002Fsup><\u002Fp>\n          <p style=\"margin:0;\">This way of eating lowers HbA1c (your three-month blood sugar average) by around 1.2%. In a trial led by Dr Neal Barnard, two-thirds of participants on diabetes medication reduced or stopped it — with no calorie counting, portion control or carbohydrate limits.<sup><a href=\"#ref2\">2<\u002Fa><\u002Fsup> Only animal fat and most added oils were removed.<\u002Fp>\n          <p style=\"margin:0;\">Water helps regulate blood sugar, supports your kidneys and aids weight management. Alcohol makes diabetes worse the more you drink: it's full of empty calories, disrupts sugar metabolism and contributes to fatty liver.<\u002Fp>\n\n          <h2 style=\"margin:24px 0 0;font-family:Montserrat,sans-serif;font-weight:800;font-size:28px;color:var(--blue-800);\">E — Exercise<\u002Fh2>\n          <p style=\"margin:0;\">Exercise improves insulin sensitivity, steadies blood sugar and reduces harmful belly fat. Aim for three kinds:<\u002Fp>\n          <ol style=\"margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;\">\n            <li><strong>Aerobic:<\u002Fstrong> brisk walking, cycling, swimming or hiking — 150 minutes a week.<\u002Fli>\n            <li><strong>Intervals:<\u002Fstrong> short bursts of higher effort within your aerobic sessions.<\u002Fli>\n            <li><strong>Strength:<\u002Fstrong> weights, bands or bodyweight exercises — two or three sessions a week.<\u002Fli>\n          <\u002Fol>\n\n          <h2 style=\"margin:24px 0 0;font-family:Montserrat,sans-serif;font-weight:800;font-size:28px;color:var(--blue-800);\">R — Rest<\u002Fh2>\n          <p style=\"margin:0;\">Good sleep steadies blood sugar, improves insulin sensitivity and reduces inflammation. Aim for seven to nine hours a night, on a regular schedule. Managing stress matters too: stress raises blood sugar, disrupts sleep and leads to poor eating.<\u002Fp>\n\n          <h2 style=\"margin:24px 0 0;font-family:Montserrat,sans-serif;font-weight:800;font-size:28px;color:var(--blue-800);\">F — Fresh air, free of smoke<\u002Fh2>\n          <p style=\"margin:0;\">Smoking is an independent risk factor for type 2 diabetes. It increases insulin resistance and speeds up damage to the heart, nerves, kidneys and eyes.<\u002Fp>\n\n          <h2 style=\"margin:24px 0 0;font-family:Montserrat,sans-serif;font-weight:800;font-size:28px;color:var(--blue-800);\">E — Exposure to sunlight<\u002Fh2>\n          <p style=\"margin:0;\">Sunlight helps your skin make vitamin D. Vitamin D improves insulin sensitivity and may protect the beta cells that make insulin.<\u002Fp>\n\n          <h2 style=\"margin:24px 0 0;font-family:Montserrat,sans-serif;font-weight:800;font-size:28px;color:var(--blue-800);\">Herbs that may help<\u002Fh2>\n          <div style=\"border:1px solid var(--border-hairline);border-radius:16px;overflow:hidden;\">\n            <sc-for list=\"{{ herbs }}\" as=\"hb\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border-hairline);font-size:17px;\">\n                <span style=\"font-weight:600;color:var(--ink-900);\">{{ hb.name }}<\u002Fspan><span>{{ hb.dose }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <p style=\"margin:0;padding:14px 20px;font-size:15px;background:var(--surface-sunken);color:var(--text-muted);\">Some herbs can lower blood sugar alongside medication. Check with your doctor or pharmacist first.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;\">\n            <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Button\" variant=\"secondary\" href=\"https://drrachel.com.au/wp-content/uploads/2024/09/Defeating-Diabetes.pdf\" hint-size=\"220px,44px\">Download the PDF<\u002Fx-import>\n            <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Button\" variant=\"outline\" on-click=\"{{ goPrograms }}\" hint-size=\"220px,44px\">Come to a talk<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ faithBoxed }}\" hint-placeholder-val=\"{{ true }}\">\n          <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Card\" tint=\"blue\" padding=\"lg\" hint-size=\"100%,520px\">\n            <div style=\"display:flex;flex-direction:column;gap:16px;font-size:17px;line-height:1.7;\">\n              <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.14em;color:var(--blue-700);\">T — TIME WITH GOD · A FAITH REFLECTION<\u002Fspan>\n              <h2 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:26px;color:var(--blue-800);\">The other villain: what the Bible says about hell<\u002Fh2>\n              <p style=\"margin:0;\">On the topic of villains, there is one universal villain — Satan — who is set on distorting the character of God, so that as few people as possible accept the gift of an amazing eternity. One of his tools is the belief that God keeps the wicked alive in flames to torture them forever. That picture doesn't match how the Bible describes God.<\u002Fp>\n              <p style=\"margin:0;\"><strong>God is love.<\u002Fstrong> <em>\"I have loved you with an everlasting love; I have drawn you with unfailing kindness.\"<\u002Fem> — Jeremiah 31:3. <strong>God is a consuming fire.<\u002Fstrong> <em>\"For our God is a consuming fire.\"<\u002Fem> — Hebrews 12:29. That fire consumes sin; for the repentant, His presence is total joy.<\u002Fp>\n              <p style=\"margin:0;\"><strong>Hell is an event<\u002Fstrong>, not a place of endless torment. Malachi 4:1–3 says the wicked \"will be ashes under the soles of your feet\". Psalm 37 says they will perish and not be found. <strong>It is eternal in its consequences, not its timeline<\u002Fstrong> — Matthew 25:46 speaks of eternal punishment, not eternal punishing.<\u002Fp>\n              <p style=\"margin:0;\">So who dwells with the everlasting burning? Isaiah 33:14–17 answers: <em>\"Those who walk righteously and speak what is right… Your eyes will see the king in his beauty.\"<\u002Fem> It is the saved who dwell in the consuming fire of God's presence.<\u002Fp>\n              <div style=\"display:flex;\">\n                <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Button\" variant=\"outline\" on-click=\"{{ goWisdom }}\" hint-size=\"260px,44px\">More higher wisdom<\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fx-import>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ faithLinked }}\" hint-placeholder-val=\"{{ false }}\">\n          <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Card\" tint=\"blue\" padding=\"md\" interactive=\"{{ true }}\" on-click=\"{{ goWisdom }}\" hint-size=\"100%,120px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;\">\n              <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.14em;color:var(--blue-700);\">T — TIME WITH GOD<\u002Fspan>\n              <p style=\"margin:0;font-size:18px;line-height:1.6;\">Read the companion faith reflection: <strong style=\"color:var(--blue-800);\">The other villain — what the Bible says about hell →<\u002Fstrong><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fx-import>\n        <\u002Fsc-if>\n\n        <section id=\"refs\" style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border-hairline);padding-top:24px;\">\n          <h2 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:18px;color:var(--blue-800);\">References<\u002Fh2>\n          <ol style=\"margin:0;padding-left:20px;font-size:15px;line-height:1.6;color:var(--text-muted);display:flex;flex-direction:column;gap:6px;\">\n            <li id=\"ref1\">Tonstad S, et al. Type of vegetarian diet, body weight, and prevalence of type 2 diabetes. Diabetes Care. 2009;32(5):791–6.<\u002Fli>\n            <li id=\"ref2\">Barnard ND, et al. A low-fat vegan diet improves glycemic control and cardiovascular risk factors in a randomized clinical trial in individuals with type 2 diabetes. Diabetes Care. 2006;29(8):1777–83.<\u002Fli>\n          <\u002Fol>\n          <p style=\"margin:0;font-size:13px;color:var(--text-muted);\">General information only. It does not replace advice from your own doctor. Last reviewed by Dr Rachel Coelho.<\u002Fp>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fsc-if>\n\n  <!-- ============ POST ============ -->\n  <sc-if value=\"{{ isPost }}\" hint-placeholder-val=\"{{ false }}\">\n    <article data-screen-label=\"Article – {{ postTitle }}\" style=\"background:#fff;\">\n      <div style=\"max-width:760px;margin:0 auto;padding:{{ pagePad }};display:flex;flex-direction:column;gap:32px;\">\n        <nav aria-label=\"Breadcrumb\" style=\"display:flex;gap:8px;font-size:15px;flex-wrap:wrap;\">\n          <a href=\"#\" sc-camel-on-click=\"{{ postBackLink }}\">{{ postSection }}<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><span>{{ postTitle }}<\u002Fspan>\n        <\u002Fnav>\n        <header style=\"display:flex;flex-direction:column;gap:16px;\">\n          <span style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.14em;color:var(--blue-600);\">{{ postEyebrow }} · {{ postTag }}<\u002Fspan>\n          <h1 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(36px,5vw,56px);line-height:1.05;letter-spacing:-0.02em;color:var(--blue-800);\">{{ postTitle }}<\u002Fh1>\n          <p style=\"margin:0;font-size:20px;line-height:1.6;color:var(--ink-700);\">{{ postDek }}<\u002Fp>\n          <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--text-muted);\">\n            <span>{{ postByline }}<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspan><span>{{ postDate }}<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspa ;font-size:clamp(36px,5vw,56px);line-height:1.05;letter-spacing:-0.02em;color:var(--blue-800);\">Life wisdom for deeper thinking<\u002Fh1>\n          <p style=\"margin:0;font-size:18px;line-height:1.6;\">Reflections on failure, forgiveness, friendship and purpose, drawn from Scripture and a life of coaching people.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:24px;\">\n          <sc-for list=\"{{ wisdomPosts }}\" as=\"w\" hint-placeholder-count=\"6\">\n            <a href=\"#\" sc-camel-on-click=\"{{ w.go }}\" style=\"text-decoration:none;color:inherit;display:block;\">\n              <x-import component-from-global-scope=\"BestLifeCareSolutionsDesignSystem_394469.Card\" padding=\"none\" interactive=\"{{ true }}\" hint-size=\"100%,360px\" style=\"overflow:hidden;height:100%;\">\n                <img src=\"{{ w.img }}\" alt=\"\" style=\"width:100%;aspect-ratio:2/1;object-fit:cover;display:block;background:var(--blue-050);\">\n                <div style=\"padding:24px;display:flex;flex-direction:column;gap:10px;\">\n                  <h2 style=\"margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:21px;color:var(--blue-800);\">{{ w.title }}<\u002Fh2>\n                  <p style=\"margin:0;line-height:1.6;font-size:16px;\">{{ w.excerpt }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fx-import>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ PROGRAMS ============ -->\n  <sc-if value=\"{{ isPrograms }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Programs\" style=\"background:var(--surface-canvas);\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:{{ pagePad }};display:flex;flex-direction:column;gap:40px;\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;max-width:64ch;\">\n          <span st
